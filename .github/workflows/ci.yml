name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Packages excluded from CI: internal/ebpf, internal/certebpf
# These require clang + bpf2go-generated files and only run on real Linux nodes.
# They are tested on the Talos lab cluster, not in GitHub Actions.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build (pure-Go packages)
        run: |
          go build ./cmd/reflector-map/...

      - name: Vet
        run: |
          go vet ./internal/auth/...
          go vet ./internal/extract/...
          go vet ./internal/forward/...
          go vet ./internal/metrics/...
          go vet ./internal/policy/...
          go vet ./internal/session/...
          go vet ./internal/stream/...
          go vet ./cmd/reflector-map/...

      - name: Test
        run: |
          go test -race -v \
            ./internal/auth/... \
            ./internal/extract/... \
            ./internal/forward/... \
            ./internal/policy/... \
            ./internal/session/... \
            ./internal/stream/... \
            ./test/integration/attest/... \
            ./test/integration/auth/... \
            ./test/integration/profile/... \
            ./test/integration/rotation/...
          # test/integration/adr006 requires eBPF/clang — runs on Talos lab only

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerability check
        run: |
          govulncheck \
            ./internal/auth/... \
            ./internal/extract/... \
            ./internal/forward/... \
            ./internal/metrics/... \
            ./internal/policy/... \
            ./internal/session/... \
            ./internal/stream/... \
            ./cmd/reflector-map/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: golangci-lint
        run: |
          golangci-lint run \
            ./internal/auth/... \
            ./internal/extract/... \
            ./internal/forward/... \
            ./internal/metrics/... \
            ./internal/policy/... \
            ./internal/session/... \
            ./internal/stream/... \
            ./cmd/reflector-map/...
