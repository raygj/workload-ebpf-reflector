# Deployment: reflector-map sidecar
# Receives gRPC stream from reflectors, maintains session map,
# exposes HTTP query API. Co-deployed with NHI-PAM-Tool worker (ADR-003).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reflector-map
  namespace: ebpf-reflector
  labels:
    app.kubernetes.io/name: reflector-map
    app.kubernetes.io/component: sidecar
    app.kubernetes.io/part-of: mcp-ebpf-reflector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reflector-map
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reflector-map
        app.kubernetes.io/component: sidecar
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: reflector-map
          image: your-registry:5000/reflector-map:dev
          imagePullPolicy: Always
          args:
            - --grpc-addr=:9100
            - --http-addr=:9101
            - --metrics-addr=:9091
            - --stale-ttl=60s
          ports:
            - name: grpc
              containerPort: 9100
              protocol: TCP
            - name: http
              containerPort: 9101
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: reflector-map
  namespace: ebpf-reflector
  labels:
    app.kubernetes.io/name: reflector-map
spec:
  selector:
    app.kubernetes.io/name: reflector-map
  ports:
    - name: grpc
      port: 9100
      targetPort: grpc
    - name: http
      port: 9101
      targetPort: http
    - name: metrics
      port: 9091
      targetPort: metrics
---
# ServiceMonitor for Prometheus Operator (OCP cluster-monitoring)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: reflector-map
  namespace: ebpf-reflector
  labels:
    app.kubernetes.io/name: reflector-map
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: reflector-map
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
